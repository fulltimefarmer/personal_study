[project]
name = "shopping-assistant"
version = "0.1.0"
description = "LEGO AI shopping assistant (FastAPI + LangGraph + ChromaDB)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.14.3",
    "fastapi>=0.138.1",
    "huggingface-hub>=1.21.0",
    "langchain>=1.3.11",
    "langchain-chroma>=1.1.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.2.0",
    "loguru>=0.7.3",
    "neo4j>=6.2.0",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.6.0",
    "sqlalchemy>=2.0.36",
    "streamlit>=1.37.0",
    "tabulate>=0.10.0",
    "tavily-python>=0.7.26",
    "tqdm>=4.68.3",
    "uvicorn>=0.49.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-mock>=3.14", "httpx>=0.28"]

[project.scripts]
lego = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: Unit tests (fast, no external deps)",
    "integration: Integration tests (need external services)",
    "neo4j: Tests that require Neo4j connection",
    "llm: Tests that call LLM APIs",
    "db: Tests that require PostgreSQL",
    "vector: Tests that require ChromaDB",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
